            padding: 20px;
            min-height: 100vh;
        }
        .container {
            background: white;

            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            box-shadow: 0 0 30px rgba(0,0,0,0.3);
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .titulo { font-size: 20px; font-weight: bold; }
        .cronometro { 
            background: rgba(255,255,255,0.2);
            padding: 8px 15px;
            border-radius: 5px;
            font-weight: bold;
        }
        .seletor-disciplina {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .btn-disciplina {
            padding: 10px 15px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        .btn-disciplina:hover { background: #667eea; color: white; }
        .btn-disciplina.ativo { background: #667eea; color: white; }
        .botoes { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            flex: 1;
        }
        .btn-pausar { background: #FFD700; color: #333; }
        .btn-finalizar { background: #4CAF50; color: white; }
        .btn-fechar { background: #f44336; color: white; }
        .btn:hover { opacity: 0.9; }
        .questao {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            background: #f9f9f9;
        }
        .questao-titulo {
            font-weight: bold;
            margin-bottom: 12px;
            font-size: 15px;
            line-height: 1.5;
            color: #333;
        }
        .opcao {
            display: flex;
            align-items: center;
            padding: 8px;
            margin: 8px 0;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .opcao:hover { background: #e8e8ff; }
        .opcao input { margin-right: 10px; cursor: pointer; width: 18px; height: 18px; }
        .opcao label { cursor: pointer; flex: 1; }
        .resultado {
            text-align: center;
            padding: 40px;
            background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
            border-radius: 10px;
        }
        .resultado-titulo { font-size: 28px; font-weight: bold; color: #2e7d32; margin-bottom: 15px; }
        .resultado-percentual { font-size: 56px; font-weight: bold; color: #4CAF50; margin: 20px 0; }
        .resultado-texto { font-size: 18px; margin: 10px 0; color: #333; }
        #conteudo { max-height: 650px; overflow-y: auto; margin-bottom: 10px; }
        .progresso { text-align: center; margin-top: 10px; color: #666; font-size: 14px; font-weight: bold; }

</head>

            'MT': {nome: '📊 Matemática (25 questões)', questoes: questoesMT, tempo: 3600},

            'FINAL': {nome: '🎓 Simulado Final (100 questões)', questoes: questoesFINAL, tempo: 7200},
        };

        let disciplinaAtual = 'MT';
        let respostas = {};
        let tempoRestante = 3600;
        let ativo = true;

        function mudarDisciplina(tipo) {
            disciplinaAtual = tipo;
            respostas = {};
            tempoRestante = bancos[tipo].tempo;
            ativo = true;
            
            document.querySelectorAll('.btn-disciplina').forEach(btn => btn.classList.remove('ativo'));
            event.target.classList.add('ativo');
            
            renderizar();
            atualizarProgresso();
        }

        function renderizar() {
            const conteudo = document.getElementById('conteudo');
            const questoes = bancos[disciplinaAtual].questoes;
            const titulo = bancos[disciplinaAtual].nome;
            
            document.getElementById('titulo').textContent = titulo;
            conteudo.innerHTML = '';
            
            questoes.forEach(q => {
                const div = document.createElement('div');
                div.className = 'questao';
                
                let html = `<div class="questao-titulo">Q${q.numero}: ${q.texto}</div>`;
                q.opcoes.forEach(op => {
                    html += `<div class="opcao">
                        <input type="radio" name="q${q.numero}" value="${op.letra}" id="q${q.numero}_${op.letra}" onchange="salvarResposta(${q.numero}, '${op.letra}')">
                        <label for="q${q.numero}_${op.letra}">${op.letra}) ${op.texto}</label>
                    </div>`;
                });
                
                div.innerHTML = html;
                conteudo.appendChild(div);
            });
        }

        window.salvarResposta = function(num, letra) {
            respostas[num] = letra;
            atualizarProgresso();
        };

        function atualizarProgresso() {
            const questoes = bancos[disciplinaAtual].questoes;
            const respondidas = Object.keys(respostas).length;
            document.getElementById('progresso').textContent = `${respondidas} de ${questoes.length} respondidas`;
        }

        // Cronômetro
        setInterval(() => {
            if (!ativo) return;
            tempoRestante--;
            const h = Math.floor(tempoRestante / 3600);
            const m = Math.floor((tempoRestante % 3600) / 60);
            const s = tempoRestante % 60;
            document.getElementById('cronometro').textContent = 
                `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            if (tempoRestante <= 0) finalizar();
        }, 1000);

        // Botões
        document.getElementById('btnPausar').onclick = () => {
            ativo = !ativo;
            document.getElementById('btnPausar').textContent = ativo ? '⏸️ Pausar' : '▶️ Retomar';
        };

        document.getElementById('btnFinalizar').onclick = finalizar;
        
        document.getElementById('btnFechar').onclick = () => window.close();

        function finalizar() {
            ativo = false;
            const questoes = bancos[disciplinaAtual].questoes;
            const acertos = questoes.filter(q => respostas[q.numero] === q.resposta).length;
            const percentual = Math.round((acertos / questoes.length) * 100);
            
            document.getElementById('conteudo').innerHTML = `
                <div class="resultado">
                    <div class="resultado-titulo">Simulado Finalizado! 🎉</div>
                    <div class="resultado-texto">Acertos: <strong>${acertos} de ${questoes.length}</strong></div>

                    </div>
                </div>
            `;
        }

        // Iniciar
        renderizar();
        atualizarProgresso();
